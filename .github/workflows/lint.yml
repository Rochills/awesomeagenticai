name: Lint (link rot + banned words + schema)

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/**'
      - 'resources/**'
  schedule:
    # 每月 1 號 UTC 03:00 跑完整檢查（catch link rot + star drift）
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  banned-words:
    name: Banned-word audit (zh-Hans slips + overclaim phrases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check zh-Hans slips in zh-TW canonical files
        run: |
          # 只掃 zh-TW canonical 檔。
          #   - --exclude="*.en.md"     skip 英文 companion
          #   - --exclude="*.zh-Hans.md"  skip 簡中 companion（裡面合法包含這些詞）
          #   resources/style-guide.md 跟 .github/ 是 policy doc，必然包含禁用詞做為
          #   「不要這樣寫」的範例，所以這個 step 也不掃 resources/。
          BANNED=("教程" "視頻" "軟件" "代碼" "用戶" "網絡" "默認" "函数" "演算法" "算法" "程序")
          FOUND=0
          for word in "${BANNED[@]}"; do
            if grep -rn --include="*.md" --exclude="*.en.md" --exclude="*.zh-Hans.md" \
                  -F "$word" stages branches walkthroughs README.md CONTRIBUTING.md CONTRIBUTORS.md 2>/dev/null \
                  | grep -v "(zh-Hans)" \
                  | grep -v "zh-Hans repo" \
                  | grep -v "中文（zh-Hans）"; then
              echo "❌ Banned word found: $word"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo ""
            echo "Found $FOUND banned-word violations. See resources/style-guide.md §3."
            exit 1
          fi
          echo "✓ No banned words detected."

      - name: Check zh-TW residue in zh-Hans files (warning only)
        run: |
          # 反向檢查：zh-Hans 檔混入 zh-TW 用詞代表翻譯沒翻完。
          # **僅 warning 模式**——不擋 PR、不要求完美。zh-Hans 翻譯是漸進的，
          # 殘留是常態；這個 check 只是提示哪幾個詞還可以順手修。
          # 不掃：style-guide / glossary（會引用對照詞當例子）、.ai/、book/。
          BANNED_TW=("使用者" "軟體" "硬體" "資訊" "品質" "資料" "專案" "腳本" "預設" "影片" "演算法" "應用程式" "網路" "連結" "服務" "範例" "範本" "設定" "註解" "終端機" "命令列" "編輯器" "瀏覽器" "客戶端" "伺服器" "倉儲" "必修閱讀" "飛書")
          FOUND=0
          for word in "${BANNED_TW[@]}"; do
            if grep -rn --include="*.zh-Hans.md" \
                  -F "$word" . 2>/dev/null \
                  | grep -v "^./resources/style-guide.zh-Hans.md" \
                  | grep -v "^./resources/glossary.zh-Hans.md" \
                  | grep -v "^./.ai/" \
                  | grep -v "^./book/"; then
              echo "::warning::zh-TW word found in zh-Hans file: $word"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo "Note: $FOUND zh-TW residue word(s) detected in .zh-Hans.md. See .ai/zh-Hans_glossary.md. Not blocking the PR — fix when convenient."
          else
            echo "✓ No zh-TW residue."
          fi

      - name: Check overclaim phrases (strict — blocking)
        run: |
          # 掃公開展示的內容檔（zh + en + zh-Hans）找 style-guide §3 列為禁用的 overclaim 用語。
          # 範圍涵蓋 stages/ branches/ walkthroughs/ tracks/ examples/ resources/（含
          # mcp-skills-catalog / cookbook / cli-agents-guide 等實際被讀者讀到的文件）+ 各
          # top-level 文件。
          #
          # 路徑 hygiene：
          #   - `.github/` 整個資料夾不在掃描 paths（內含 outreach drafts 跟「Don't say...」
          #     明示禁用清單，本來就會引用禁用詞、不該被掃）。
          #   - `resources/style-guide.md` + `resources/glossary.md` 透過 grep -v 後過濾
          #     （它們在 resources/ 下、必然被 recurse 到，且為了當 policy 例子會列禁用詞）。
          #
          # 用 `grep -Fi`（fixed string + case-insensitive）—— 2026-05-26 incident：上一輪
          # sweep 用 -F 是 case-sensitive、漏掉 examples/ 內 H2 標題的 `Production-grade`
          # 大寫變體 5 處。這次升級為 -Fi。
          #
          # Warn-only step history：原本有第二個 step 掃 `最完整的` 之類的灰色地帶用語、
          # 用 ::warning:: 不擋 PR。實測 corpus 有 30+ hit（多半是稱讚 Datawhale Hello-Agents
          # 之類他人專案的 citation framing、非 self-promo overclaim），噪音大於價值、移除。
          # 如未來要為其他灰色詞加 warn 機制，pattern 可參考 git log 找 2026-05-26 此 step
          # 的初版實作（drafted but removed pre-merge）。
          OVERCLAIMS=(
            # === existing canonical bans ===
            "the most canonical"
            "全世界最好的"
            "業界最強"
            "最緊迫"
            # === style-guide §3 expansions (2026-05-26, P3-G from audit) ===
            "首選"            # zh-TW "top choice"
            "首选"            # zh-Hans variant
            "唯一選擇"        # zh-TW "only choice"
            "唯一选择"        # zh-Hans
            "業界最佳"        # zh-TW "industry best" (sibling of 業界最強)
            "业界最佳"        # zh-Hans
            # === audit P3-G English overclaim (case-insensitive matches all variants) ===
            "production-grade"   # supersedes the older exact "Production-grade Chinese tutorial"
            "world-class"
            "best-in-class"
            "cutting-edge"
            "state-of-the-art"
            "industry-leading"
          )
          FOUND=0
          for phrase in "${OVERCLAIMS[@]}"; do
            hits=$(grep -rIn --include="*.md" -Fi "$phrase" \
                  stages branches walkthroughs tracks examples resources \
                  README.md README.en.md README.zh-Hans.md \
                  CONTRIBUTING.md CONTRIBUTING.en.md CONTRIBUTING.zh-Hans.md \
                  CONTRIBUTORS.md \
                  ROADMAP.md ROADMAP.en.md ROADMAP.zh-Hans.md \
                  CAPSTONE.md CAPSTONE.en.md CAPSTONE.zh-Hans.md \
                  PROGRESS.md PROGRESS.en.md PROGRESS.zh-Hans.md \
                  RESOURCES.md RESOURCES.en.md RESOURCES.zh-Hans.md \
                  2>/dev/null \
                  | grep -v "^resources/style-guide" \
                  | grep -v "^resources/glossary" \
                  || true)
            if [ -n "$hits" ]; then
              echo "❌ Overclaim phrase found: $phrase"
              echo "$hits"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -gt 0 ]; then
            echo ""
            echo "Found $FOUND overclaim category/categories. See resources/style-guide.md §3 'Overclaim 用語禁用'."
            exit 1
          fi
          echo "✓ No overclaim phrases detected."

      - name: Check zh-Hans mainland localization (blocking)
        run: |
          # Blocking gate: zh-Hans mirrors must stay mainland-localized.
          # Catches future tw2s-only mirror syncs / hand edits that
          # reintroduce Taiwan vocab (呼叫/程式/品质…) or 「」 quotes.
          # stdlib-only script; ubuntu-latest ships python3 (no pip deps).
          python3 scripts/zh-hans-localize.py --check

      - name: Check MCP catalog counts are consistent (blocking)
        run: |
          # Blocking gate: the catalog's Index per-section counts and the
          # "NN+ MCP servers" headline repeated across README / RESOURCES /
          # branches / stages / tracks must all match the file's real entry
          # count. In 2026-08 the Index summed to 73 while the file held 76,
          # and 39 places still advertised a long-stale number — and two
          # separate hand-counts got it wrong in different ways, which is why
          # the number is now computed from the file instead of tallied by hand.
          python3 scripts/check-catalog-counts.py

      - name: check-catalog-counts.py detection unit tests
        # Pins BOTH incident classes: the entry-counting rule (an entry whose
        # heading has no bracket link must still count) and the claim coverage
        # (the first version of the checker validated only 17 of 36 real claims
        # because its regex demanded a fixed keyword right after the number).
        run: python3 scripts/test_catalog_counts.py

      - name: Check mirror pages link to their own locale (blocking)
        run: |
          # Blocking gate: an .en.md / .zh-Hans.md page must not link to the
          # zh-TW canonical when a same-locale sibling exists — that silently
          # drops non-Traditional readers onto a page they may not read.
          # 2026-08 sweep fixed 111 such links across 37 files; nothing else in
          # CI catches this (check-anchors only proves targets resolve, and
          # sync-language-switchers only manages the switcher row).
          # Fix with: python scripts/check-locale-links.py --apply
          python3 scripts/check-locale-links.py

      - name: check-locale-links.py detection unit tests
        # Pins the conservative exemptions (missing sibling / switcher row /
        # fenced code / external URL) so a future tweak can't start rewriting
        # links into dead ends. stdlib-only.
        run: python3 scripts/test_locale_links.py

      - name: Check mirror pages embed their own locale's images (blocking)
        # Companion to check-locale-links.py, which matches `.md` targets only
        # (its LINK_RE demands a .md suffix) — so image paths were invisible to
        # it and to every other gate. That blind spot let 9 references embed
        # Traditional-Chinese-only diagrams from .en.md / .zh-Hans.md pages with
        # the alt text localized but the picture not.
        #
        # Shipped advisory on 2026-08-02 because 9 locale variants did not exist
        # yet; they were produced the same day, so this is now BLOCKING.
        # Fix a failure with: python scripts/check-locale-images.py --apply
        # (that only retargets references whose variant already exists; a
        # MISSING one needs the artwork produced first — how these were
        # generated, and the verification traps, are recorded in
        # resources/diagrams/locale-variant-prompts.md).
        run: python3 scripts/check-locale-images.py

      - name: check-locale-images.py detection unit tests
        # Pins the exemptions (.md links / external URLs / fenced code /
        # already-suffixed targets) plus the EXCLUDE_DIRS absolute-vs-relative
        # path bug that made both locale gates report a silent all-clear from a
        # checkout under `.claude/worktrees/`. stdlib-only.
        run: python3 scripts/test_locale_images.py

      - name: refresh-stars.py detection unit tests
        # Pins the 2026-07 star-line write-back + neighbour-leak fix
        # (scripts/test_refresh_stars.py). stdlib-only; runs on any PR
        # touching scripts/**.
        run: python3 scripts/test_refresh_stars.py

      - name: pr-link-audit.py detection unit tests
        # Pins the PR link-audit bot's diff-parsing + advisory-flag logic
        # (scripts/test_pr_link_audit.py). stdlib-only, network-free.
        run: python3 scripts/test_pr_link_audit.py

  link-rot:
    name: Link rot check (GitHub URLs)
    runs-on: ubuntu-latest
    # 只在 schedule 跟 workflow_dispatch 跑——PR 跑會太慢
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run link-check (--fast = GitHub URLs only)
        run: python scripts/check-links.py --fast --quiet

  star-drift:
    name: Star drift detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run refresh-stars (warn only, don't fail CI)
        # gh CLI 已內建在 ubuntu-latest runner，GH_TOKEN 自動 set
        # 高門檻 (50%) 才警告，避免每月誤報
        run: |
          # 用 --check 才會在 drift 時退 1；用 || 接 ::warning:: 退 0
          if ! python scripts/refresh-stars.py --threshold 50 --check; then
            echo "::warning::Star drift detected (>=50%). 跑 'python scripts/refresh-stars.py' 看哪些 entry 要更新。"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  freshness-tests:
    name: Freshness gate unit tests
    runs-on: ubuntu-latest
    # Runs on every PR that triggers this workflow (any **.md / scripts/** /
    # resources/** change — no schedule-only guard) so the freshness-gate
    # coverage can't silently regress the way it did in 2026-07.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run freshness gate regression tests
        # Pins the 2026-07 coverage fixes: mirror-locale scanning +
        # DeepSeek space-form regex (scripts/test_freshness.py).
        run: python scripts/test_freshness.py
